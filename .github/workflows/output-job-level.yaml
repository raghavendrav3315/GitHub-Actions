name: output job level
on: workflow_dispatch
jobs:
    build:
        outputs: 
            version: ${{ steps.step1.outputs.version }}
        runs-on: ubuntu-latest
        steps:
            - name: step one
              id: step1
              run: echo "version=1.15.7" >> $GITHUB_OUTPUT
    deploy: 
        needs: build
        runs-on: ubutnu-latest
        steps:
            - name: step 2
              run: echo "This is version ${{needs.build.outputs.version}}"
