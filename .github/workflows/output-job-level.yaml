name: output job level
on: workflow_dispatch
jobs:
  build:
      outputs:
        version: $${{ steps.step1.outputs.version }}
      runs-on: ubuntu-latest
      steps:
        - name: building..
          id: step1
          run: echo "version=15.3.2" >> $GITHUB_OUTPUT
  deploy:
      needs: build
      runs-on: ubuntu-latest
      steps:
        - name: bulding..
          run: echo "Application was deployed with version ${{needs.build.outputs.version}}"
